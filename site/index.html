<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo List — Мои задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script
            src="https://code.jquery.com/jquery-4.0.0.min.js"
            integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
            crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container py-4" style="max-width: 1100px">

    <header class="navbar-custom d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center gap-3">
            <div class="brand-icon">✓</div>
            <span class="fs-4 fw-bold">Todo List</span>
        </div>
        <span class="badge rounded-pill text-bg-light">Express API</span>
    </header>

    <main class="todo-card p-4 p-md-5">
        <div class="mb-4">
            <h1 class="page-title mb-2">Мои задачи</h1>
            <p class="subtitle mb-0">Планируй. Делай. Достигай.</p>
        </div>

        <form id="taskForm" class="d-flex gap-2 mb-4">
            <input
                    id="taskInput"
                    class="form-control"
                    type="text"
                    placeholder="Добавить новую задачу..."
                    maxlength="200"
                    required
            >
            <button class="btn btn-primary flex-shrink-0" type="submit">
                + Добавить
            </button>
        </form>

        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <div class="d-flex flex-wrap gap-2" id="filters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="active">Активные</button>
                <button class="filter-btn" data-filter="completed">Выполненные</button>
            </div>
            <span class="subtitle small" id="taskCount">0 задач</span>
        </div>


        <div class="task-list mb-4" id="taskList">


        </div>


        <section class="stats row g-0">
            <div class="col-4 stat-item">
                <span class="stat-icon">▤</span>
                <div>
                    <div class="stat-label">Всего задач</div>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
            </div>
            <div class="col-4 stat-item">
                <span class="stat-icon">✓</span>
                <div>
                    <div class="stat-label">Выполнено</div>
                    <div class="stat-value" id="completedCount">0</div>
                </div>
            </div>
            <div class="col-4 stat-item">
                <span class="stat-icon">◷</span>
                <div>
                    <div class="stat-label">Осталось</div>
                    <div class="stat-value" id="activeCount">0</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center subtitle small mt-4">
        meeymirita List ·  проект на Express и Caddy
    </footer>
</div>
<script defer src="script.js"></script>
</body>
</html>
